name: Native VR launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - 'src/core/vr/vr_ini.h'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'src/core/vr/vr_ini.h'
      - '.github/workflows/launcher.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch UI and JSON dependencies
        run: git submodule update --init externals/dear_imgui externals/json
      - name: Configure
        run: cmake -S launcher -B build/launcher -A x64
      - name: Build
        run: cmake --build build/launcher --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: native-launcher-windows
          path: build/launcher/Release/Bldbrne-VR.exe

